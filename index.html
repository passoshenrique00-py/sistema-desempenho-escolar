<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desempenho Escolar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            text-align: center;
        }

        .adequado {
            background: #dcfce7;
            color: #166534;
        }

        .baixo {
            background: #fee2e2;
            color: #991b1b;
        }

        .resultado-titulo {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 Desempenho Escolar</h1>

        <p class="descricao">
            Sistema preditivo para identificação precoce
            de possível baixo desempenho escolar.
        </p>

        <label for="ano">Ano letivo</label>

        <select id="ano">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
        </select>

        <label for="frequencia">Frequência (%)</label>

        <input
            type="number"
            id="frequencia"
            min="0"
            max="100"
            value="75"
            placeholder="Digite a frequência"
        >

        <label for="usoIA">O aluno utiliza Inteligência Artificial?</label>

        <select id="usoIA">
            <option value="0">Não</option>
            <option value="1">Sim</option>
        </select>

        <button onclick="analisarAluno()">
            🔎 ANALISAR ALUNO
        </button>

        <div id="resultado"></div>

    </div>

    <script>

        function analisarAluno() {

            const ano = Number(document.getElementById("ano").value);
            const frequencia = Number(
                document.getElementById("frequencia").value
            );
            const usoIA = Number(
                document.getElementById("usoIA").value
            );

            const resultado = document.getElementById("resultado");

            if (frequencia < 0 || frequencia > 100) {

                resultado.style.display = "block";
                resultado.className = "baixo";

                resultado.innerHTML = `
                    <div class="resultado-titulo">
                        ⚠️ Frequência inválida
                    </div>
                    <p>
                        Digite um valor entre 0% e 100%.
                    </p>
                `;

                return;
            }

            /*
             * Regra inicial de demonstração.
             *
             * Na próxima etapa vamos substituir esta regra
             * pelo modelo de Machine Learning do projeto.
             */

            if (frequencia < 70) {

                resultado.style.display = "block";
                resultado.className = "baixo";

                resultado.innerHTML = `
                    <div class="resultado-titulo">
                        ⚠️ Possível baixo desempenho
                    </div>

                    <p>
                        O sistema identificou características
                        que podem indicar necessidade de
                        acompanhamento pedagógico.
                    </p>
                `;

            } else {

                resultado.style.display = "block";
                resultado.className = "adequado";

                resultado.innerHTML = `
                    <div class="resultado-titulo">
                        ✅ Desempenho adequado
                    </div>

                    <p>
                        Não foram identificadas, nesta análise inicial,
                        características associadas ao baixo desempenho.
                    </p>
                `;
            }
        }

    </script>

</body>
</html>
