<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desempenho Escolar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .titulo {
            text-align: center;
            margin-bottom: 10px;
            color: #173b67;
            font-size: 30px;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #1e293b;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
        }

        .adequado {
            background: #dcfce7;
            color: #166534;
        }

        .baixo {
            background: #fee2e2;
            color: #991b1b;
        }

        .erro {
            background: #fef3c7;
            color: #92400e;
        }

        .info {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="titulo">📚 Desempenho Escolar</h1>

    <p class="subtitulo">
        Sistema preditivo para identificação precoce
        de possível baixo desempenho escolar.
    </p>

    <label for="ano">Ano letivo</label>

    <select id="ano">
        <option value="2022">2022</option>
        <option value="2023">2023</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
    </select>


    <label for="frequencia">Frequência (%)</label>

    <input
        type="number"
        id="frequencia"
        min="0"
        max="100"
        step="0.1"
        value="75"
    >


    <label for="usoIA">O aluno utiliza Inteligência Artificial?</label>

    <select id="usoIA">
        <option value="0" selected>Não</option>
        <option value="1">Sim</option>
    </select>


    <button onclick="analisarAluno()">
        🔎 ANALISAR ALUNO
    </button>


    <div id="resultado"></div>

    <p class="info">
        Análise baseada no modelo de Árvore de Decisão desenvolvido no projeto.
    </p>

</div>


<!-- Carrega o modelo gerado no Google Colab -->
<script src="modelo_arvore.js"></script>


<script>

function analisarAluno() {

    const ano = Number(document.getElementById("ano").value);

    const frequencia =
        Number(document.getElementById("frequencia").value);

    const usoIA =
        Number(document.getElementById("usoIA").value);

    const resultado =
        document.getElementById("resultado");


    // Verificação da frequência
    if (
        isNaN(frequencia) ||
        frequencia < 0 ||
        frequencia > 100
    ) {

        resultado.style.display = "block";
        resultado.className = "erro";

        resultado.innerHTML =
            "⚠️ Informe uma frequência entre 0% e 100%.";

        return;
    }


    // Utiliza a Árvore de Decisão
    const classe =
        preverDesempenho(
            ano,
            frequencia,
            usoIA
        );


    resultado.style.display = "block";


    if (classe === 1) {

        resultado.className = "baixo";

        resultado.innerHTML = `
            ⚠️ Possível baixo desempenho escolar
            <br><br>
            Recomenda-se acompanhamento pedagógico.
        `;

    } else {

        resultado.className = "adequado";

        resultado.innerHTML = `
            ✅ Desempenho adequado
            <br><br>
            Não foram identificados indícios de baixo desempenho pelo modelo.
        `;
    }
}

</script>

</body>
</html>
